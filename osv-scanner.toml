# OSV Scanner Configuration
# This file documents vulnerabilities that are accepted as low-risk for this project.
#
# Rationale for ignored vulnerabilities:
# 1. All are in dev/build-time dependencies, not production runtime
# 2. Vulnerabilities require specific, unlikely conditions to exploit
# 3. Fixing would require major dependency refactoring
# 4. No user-facing impact on production application

