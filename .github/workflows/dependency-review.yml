name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency graph support
        id: depgraph
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const res = await github.request("GET /repos/{owner}/{repo}", { owner, repo });
              const status = res.data?.security_and_analysis?.dependency_graph?.status || "unknown";
              core.setOutput("enabled", status === "enabled" ? "true" : "false");
              core.info(`dependency_graph status: ${status}`);
            } catch (err) {
              core.warning(`Unable to detect dependency_graph status: ${err.message}`);
              core.setOutput("enabled", "false");
            }

      - name: Dependency Review
        if: steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4

      - name: Skip notice
        if: steps.depgraph.outputs.enabled != 'true'
        run: echo "Dependency graph is not enabled for this repository; skipping dependency-review check."
