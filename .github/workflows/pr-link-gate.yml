name: PR Link Gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  enforce-pr-linking:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate linked issue and TCK in PR body
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.pull_request?.body || "";
            const closesPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/i;
            const tckPattern = /\bTCK-\d{8}-\d{3}\b/;

            const errors = [];
            if (!closesPattern.test(body)) {
              errors.push("Missing linked issue. Add `Closes #<issue-number>` in PR body.");
            }
            if (!tckPattern.test(body)) {
              errors.push("Missing worklog ticket. Add `TCK-YYYYMMDD-NNN` in PR body.");
            }

            if (errors.length) {
              core.setFailed(errors.join("\n"));
            } else {
              core.info("PR link gate passed.");
            }
