area/frontend:
  - changed-files:
      - any-glob-to-any-file:
          - src/frontend/**/*

area/backend:
  - changed-files:
      - any-glob-to-any-file:
          - src/backend/**/*

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - prompts/**/*

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**/*
          - .githooks/**/*
          - scripts/**/*

area/assets:
  - changed-files:
      - any-glob-to-any-file:
          - src/frontend/public/assets/**/*
          - assets/**/*
