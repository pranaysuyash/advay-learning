name: Audit remediation
description: Track a concrete audit finding through remediation.
title: "audit: "
labels:
  - type/audit
  - status/inbox
body:
  - type: input
    id: finding
    attributes:
      label: Source finding
      description: Audit file + finding ID.
      placeholder: docs/audit/foo.md :: Finding #3
    validations:
      required: true
  - type: textarea
    id: scope_contract
    attributes:
      label: Scope contract
      placeholder: |
        In-scope:
        Out-of-scope:
        Behavior change allowed: YES/NO
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      placeholder: |
        Command:
        Output:
        Interpretation: Observed/Inferred/Unknown
    validations:
      required: true
  - type: input
    id: prompt_trace
    attributes:
      label: Prompt trace
      placeholder: prompts/remediation/implementation-v1.6.1.md
    validations:
      required: true
  - type: input
    id: worklog_ticket
    attributes:
      label: Linked worklog ticket
      placeholder: TCK-20260309-011
    validations:
      required: true
