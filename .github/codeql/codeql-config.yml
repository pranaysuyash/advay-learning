name: "repo-codeql-config"

# Keep analysis focused on shipped source while avoiding generated artifacts.
paths:
  - src
  - scripts

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/e2e/**"
  - "docs/**"
  - "tools/**"
  - ".agent/**"
  - "src/frontend/public/assets/**"

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      problem.severity:
        - warning
